<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">中文剧本创作：三幕式与 15 Beats</title>
  <desc id="desc">一个把主题、人物和情节碎片发展成三幕式、15 Beats 与场景大纲的中文创作 skill。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081421"/>
      <stop offset="0.55" stop-color="#10273A"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8A94D"/>
      <stop offset="0.5" stop-color="#F3D58C"/>
      <stop offset="1" stop-color="#73C8E4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <path d="M0 286 C220 230 338 334 528 264 S862 188 1200 244" fill="none" stroke="#2B536A" stroke-width="2" opacity="0.55"/>
  <path d="M0 302 C220 246 338 350 528 280 S862 204 1200 260" fill="none" stroke="#17394D" stroke-width="1" opacity="0.8"/>
  <path d="M636 0 V380 M660 0 V380" stroke="#17394D" stroke-width="1" opacity="0.55"/>

  <g id="title-block" transform="translate(64 48)">
    <text x="0" y="0" fill="#E8B85B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3">SCREENPLAY SKILL</text>
    <text x="0" y="72" fill="#F7F0E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="54" font-weight="700">三幕式 × 15 Beats</text>
    <text x="0" y="116" fill="#F7F0E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="30" font-weight="500">把一个想法，推到可以拍出来。</text>
    <text x="0" y="164" fill="#A9C0CB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22">主题 / 人物 / 情节碎片 → 可执行的故事结构</text>
    <path d="M0 195 H440" stroke="#D8A94D" stroke-width="3"/>
    <text x="0" y="232" fill="#F7F0E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24">中文 AI 剧情短片 · TVC · 故事开发</text>
  </g>

  <g id="story-engine" transform="translate(704 48)">
    <text x="0" y="0" fill="#A9C0CB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">STORY ENGINE</text>
    <rect x="0" y="24" width="432" height="172" rx="18" fill="#0B1D2C" stroke="#31566B" stroke-width="2"/>
    <path d="M38 116 H394" stroke="#3B6071" stroke-width="3"/>
    <path d="M38 116 H176" stroke="#D8A94D" stroke-width="5"/>
    <path d="M176 116 H302" stroke="#E6C477" stroke-width="5"/>
    <path d="M302 116 H394" stroke="#73C8E4" stroke-width="5"/>
    <g fill="#0B1D2C" stroke="#F3D58C" stroke-width="3">
      <circle cx="38" cy="116" r="10"/><circle cx="176" cy="116" r="10"/><circle cx="302" cy="116" r="10"/><circle cx="394" cy="116" r="10"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      <text x="28" y="73" fill="#F7F0E4" font-size="24" font-weight="700">建立</text>
      <text x="28" y="158" fill="#A9C0CB" font-size="18">1–5</text>
      <text x="166" y="73" fill="#F7F0E4" font-size="24" font-weight="700">对抗</text>
      <text x="166" y="158" fill="#A9C0CB" font-size="18">6–12</text>
      <text x="292" y="73" fill="#F7F0E4" font-size="24" font-weight="700">解决</text>
      <text x="292" y="158" fill="#A9C0CB" font-size="18">13–15</text>
      <text x="18" y="184" fill="#D8A94D" font-size="16">触发</text>
      <text x="154" y="184" fill="#E6C477" font-size="16">升级</text>
      <text x="282" y="184" fill="#73C8E4" font-size="16">选择</text>
    </g>
  </g>

  <g id="beat-rail" transform="translate(64 326)">
    <path d="M0 0 H1072" stroke="url(#rail)" stroke-width="3"/>
    <g fill="#F3D58C">
      <circle cx="0" cy="0" r="7"/><circle cx="76" cy="0" r="7"/><circle cx="152" cy="0" r="7"/><circle cx="228" cy="0" r="7"/><circle cx="304" cy="0" r="7"/>
    </g>
    <g fill="#E6C477">
      <circle cx="380" cy="0" r="7"/><circle cx="456" cy="0" r="7"/><circle cx="532" cy="0" r="7"/><circle cx="608" cy="0" r="7"/><circle cx="684" cy="0" r="7"/><circle cx="760" cy="0" r="7"/><circle cx="836" cy="0" r="7"/>
    </g>
    <g fill="#73C8E4">
      <circle cx="912" cy="0" r="7"/><circle cx="992" cy="0" r="7"/><circle cx="1072" cy="0" r="7"/>
    </g>
    <g fill="#A9C0CB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <text x="0" y="34">01</text><text x="286" y="34">05</text><text x="668" y="34">10</text><text x="1042" y="34">15</text>
    </g>
    <text x="420" y="34" fill="#F7F0E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="600">从灵感到可拍摄的场景大纲</text>
  </g>
